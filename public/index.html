<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EZ QR Code — free custom-color QR code generator</title>
    <meta
      name="description"
      content="Paste a URL, pick your colors with a hex code, and download a QR code as PNG or SVG. Free, no sign-up, works offline."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230f1115'/%3E%3Cpath fill='%23fff' d='M2 2h4v4H2zM10 2h4v4h-4zM2 10h4v4H2zM7 2h1v1H7zM7 4h1v3H7zM2 7h3v1H2zM8 8h1v1H8zM10 7h1v1h-1zM12 8h2v1h-2zM7 12h1v2H7zM9 10h1v4H9zM11 11h3v1h-3zM12 13h2v1h-2z'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <h1>
          <span class="mark" aria-hidden="true"></span>
          EZ QR Code
        </h1>
        <p class="tagline">
          Paste a link, pick your colors, download the code. Everything runs in
          your browser — nothing is uploaded.
        </p>
        <nav class="tabs" aria-label="QR code type">
          <a href="/" aria-current="page">Link</a>
          <a href="/wifi/">Wi-Fi</a>
        </nav>
      </header>

      <main class="layout">
        <section class="panel controls" id="qr-controls" aria-label="QR code settings">
          <div class="field">
            <label for="content">URL or text</label>
            <textarea
              id="content"
              rows="2"
              spellcheck="false"
              autocapitalize="off"
              autocorrect="off"
              placeholder="https://example.com"
            >https://example.com</textarea>
            <div class="row-between">
              <p class="hint" id="content-hint"></p>
              <p class="hint counter" id="content-counter"></p>
            </div>
            <button type="button" class="ghost-btn hidden" id="add-scheme">
              Add https:// for me
            </button>
          </div>
          <!-- Colors, error correction and sizing are injected here by qr-ui.js -->
        </section>

        <section class="panel preview" id="qr-preview" aria-label="QR code preview"></section>
      </main>

      <footer class="footer">
        <p>
          Built with no tracking, no accounts, and no server — the QR code is
          generated on your device.
        </p>
      </footer>
    </div>

    <script src="qr.js"></script>
    <script src="qr-ui.js"></script>
    <script src="link.js"></script>
  </body>
</html>
