# Render Blueprint — https://render.com/docs/blueprint-spec
#
# This is a plain static site: no build step, no dependencies, nothing to
# install. Render just serves the files in ./public.
services:
  - type: web
    name: ez-qr-code
    runtime: static
    buildCommand: ""
    staticPublishPath: ./public
    # Never cache the HTML, so a redeploy is picked up immediately. Nothing
    # here is content-hashed, so the JS and CSS are left on Render's default
    # of `public, max-age=0, s-maxage=300`, which revalidates.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      # Every directory needs both its bare and its index.html form. Render
      # matches these rules against the *request* path, not the file it
      # resolves to, so a rule for /index.html alone does nothing for
      # visitors — who request "/" and get Render's default instead.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /wifi
        name: Cache-Control
        value: no-cache
      - path: /wifi/
        name: Cache-Control
        value: no-cache
      - path: /wifi/index.html
        name: Cache-Control
        value: no-cache
